<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像一覧</title>

<style>
body {
    margin: 0;
    background-color: #111;
    color: white;
}

/* セット間隔 */
.card {
    margin: 40px 0;
}

/* 通常画像（ima） */
.main-img {
    width: 100%;
    height: auto;
    display: block;
}

/* add画像（統一サイズ＋少し左寄せ） */
.add-img {
    width: 500px;      /* ←全て同じサイズ（add1基準） */
    max-width: 90%;    /* スマホ対応 */
    height: auto;

    display: block;
    margin: 10px 0 10px 10%; /* ←少し左寄せ */
    
    /* 見た目強化（任意） */
    border: 2px solid #888;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="card">
    <img src="ima1.png" class="main-img">
    <img src="add1.png" class="add-img">
</div>

<div class="card">
    <img src="ima2.png" class="main-img">
</div>

<div class="card">
    <img src="ima3.png" class="main-img">
    <img src="add3.png" class="add-img">
</div>

<div class="card">
    <img src="ima4.png" class="main-img">
    <img src="add4.png" class="add-img">
</div>

<div class="card">
    <img src="ima5.png" class="main-img">
    <img src="add5.png" class="add-img">
</div>

<div class="card">
    <img src="ima6.png" class="main-img">
    <img src="add6.png" class="add-img">
</div>

<div class="card">
    <img src="ima7.png" class="main-img">
    <img src="add7.png" class="add-img">
</div>

<div class="card">
    <img src="ima8.png" class="main-img">
    <img src="add8.png" class="add-img">
</div>

<div class="card">
    <img src="ima9.png" class="main-img">
    <img src="add9.png" class="add-img">
</div>

<div class="card">
    <img src="ima10.png" class="main-img">
    <img src="add10.png" class="add-img">
</div>

<div class="card">
    <img src="ima11.png" class="main-img">
    <img src="add11.png" class="add-img">
</div>

</body>
</html>

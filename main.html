<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メイン画面</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
}

/* 背景コンテナ */
.container {
    position: relative;
    width: 100%;
}

/* 背景画像 */
.background {
    width: 100%;
    display: block;
}

/* 共通 */
.section, .cards-title, .rule-text {
    position: absolute;
    transform: translate(-50%, -50%);
    color: white;
    text-align: center;
}

/* 画像 */
.section img {
    width: 40vw; /* ←画面に応じて変わる */
    max-width: 480px;
    cursor: pointer;
    transition: 0.3s;
}

.section img:hover {
    transform: scale(1.05);
}

/* ===== 位置（割合で指定） ===== */

/* Cards文字 */
.cards-title {
    top: 75%;   /* ←ここ調整 */
    left: 58%;
    font-size: 4vw;
    font-weight: bold;
}

/* cards画像 */
.cards {
    top: 85%;
    left: 30%;
}

/* main3画像 */
.rule {
    top: 81%;
    left: 70%;
}

/* Rule文字 */
.rule-text {
    top: 90%;
    left: 57%;
    font-size: 4vw;
    font-weight: bold;
    text-decoration: none;
}

.rule-text:hover {
    color: yellow;
}

</style>
</head>

<body>

<div class="container">

    <img src="main1.jpg" class="background">

    <div class="cards-title">Cards</div>

    <div class="section cards">
        <a href="cards.html">
            <img src="main2.jpg">
        </a>
    </div>

    <div class="section rule">
        <a href="cards.html">
            <img src="main3.png">
        </a>
    </div>

    <a href="rule.html" class="rule-text">Rule</a>

</div>

</body>
</html>

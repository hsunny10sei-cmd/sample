<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メイン画面</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
}

/* 背景 */
.background {
    width: 100%;
    display: block;
}

/* 共通 */
.section {
    position: absolute;
    text-align: center;
}

/* 画像 */
.section img {
    width: 480px;
    cursor: pointer;
    transition: 0.3s;
}

/* ホバー */
.section img:hover {
    transform: scale(1.05);
}

/* CARDS文字 */
.cards-title {
    position: absolute;
    top: 755px;
    left: 55%;
    transform: translateX(-50%);
    font-size: 32px;
    color: white;
    font-weight: bold;
}

/* RULE文字 */
.rule-text {
    position: absolute;
    top: 900px;   /* ←調整 */
    left: 54.5%;    /* ←調整 */
    transform: translateX(-50%);
    font-size: 32px;
    color: white;
    font-weight: bold;
    text-decoration: none;
}

/* ホバー */
.rule-text:hover {
    color: yellow;
}

/* === 位置調整 === */

/* cards画像 */
.cards {
    top: 780px;
    left: 27%;
    transform: translateX(-50%);
}

/* main3画像（クリックあり） */
.rule {
    position: absolute;
    top: 800px;   /* ←ここで位置調整 */
    left: 70%;    /* ←ここで位置調整 */
    transform: translateX(-50%);
}

</style>
</head>

<body>

<!-- 背景 -->
<img src="main1.jpg" class="background" alt="背景">

<!-- CARDS文字 -->
<div class="cards-title">Cards</div>

<!-- cards -->
<div class="section cards">
    <a href="cards.html">
        <img src="main2.jpg" alt="cards">
    </a>
</div>

<!-- main3（クリックでruleへ） -->
<div class="section rule">
    <a href="cards.html">
        <img src="main3.png" alt="rule">
    </a>
</div>

<!-- RULE文字 -->
<a href="rule.html" class="rule-text">Rule</a>

</body>
</html>
